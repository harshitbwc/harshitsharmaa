<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd60a" />
      <stop offset="1" stop-color="#f5a800" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a3d" />
      <stop offset="1" stop-color="#060a1c" />
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="104" /></clipPath>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="102.5" fill="none" stroke="#1b2a5c" stroke-width="3" />

  <!-- black/yellow hazard stripe, bottom edge -->
  <g clip-path="url(#clip)">
    <g transform="translate(0 452)">
      <rect width="512" height="60" fill="#0a0a0a" />
      <g fill="#ffd60a">
        <polygon points="-20,60 10,0 40,0 10,60" />
        <polygon points="40,60 70,0 100,0 70,60" />
        <polygon points="100,60 130,0 160,0 130,60" />
        <polygon points="160,60 190,0 220,0 190,60" />
        <polygon points="220,60 250,0 280,0 250,60" />
        <polygon points="280,60 310,0 340,0 310,60" />
        <polygon points="340,60 370,0 400,0 370,60" />
        <polygon points="400,60 430,0 460,0 430,60" />
        <polygon points="460,60 490,0 520,0 490,60" />
      </g>
    </g>
  </g>

  <!-- hardhat -->
  <g transform="translate(256 206)">
    <path d="M-120 44 C-120 -58 -52 -124 0 -124 C52 -124 120 -58 120 44 Z" fill="url(#hat)" />
    <rect x="-140" y="36" width="280" height="30" rx="15" fill="#0a0a0a" />
    <rect x="-14" y="-124" width="28" height="36" rx="6" fill="#0a0a0a" />
  </g>

  <!-- signature squiggle, standing in for wireless "air" signing -->
  <path d="M166 322 C196 292 226 352 256 322 C286 292 316 352 346 322" fill="none" stroke="#ffd60a" stroke-width="10" stroke-linecap="round" />
</svg>
